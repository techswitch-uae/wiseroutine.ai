# Versioning and the changelog, driven by what the commits say.
#
# Release Please proposes versions from Conventional Commits. The first cut
# needs an explicit bootstrap commit; see docs/releasing.md. Manual dispatch
# opens the PR, then a second dispatch after merge creates a DRAFT release.
# Candidate verification and installer builds never publish that draft.
#
# `fix:` -> patch, `feat:` -> minor, `feat!:` or a `BREAKING CHANGE:` footer ->
# major. A commit with no recognised prefix is not a mistake, it simply does not
# appear in the changelog and does not move the version.
name: Release

# Manual only, for now.
#
# The pipeline is complete but deliberately not armed: releasing is a decision,
# and until the updater signing key exists a release would produce installers
# that no installed app will accept. Run it from the Actions tab to cut the
# first release. To go automatic afterwards, put back:
#
#   push:
#     branches: [main]
#
# and every merge to main that carries a `feat:` or `fix:` opens a release PR.
on:
  workflow_dispatch:

# Release Please writes a branch, a PR and a tag, so it needs more than the
# default read-only token.
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Only release reviewed main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Homebrew no longer taps a formula's third-party dependencies on its own,
      # and turso depends on libsql/sqld/sqld.
      - run: |
          brew tap tursodatabase/tap
          brew tap libsql/sqld
          brew install tursodatabase/tap/turso
      - run: pnpm install --frozen-lockfile
      - run: pnpm addon:verify
      - run: pnpm exec turbo run typecheck test --force
      - run: pnpm test:release
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: pnpm release:config
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the build job that will attach installers to the release.
      # True on the dispatch AFTER the release PR was merged.
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      id: ${{ steps.release.outputs.id }}
      # The commit the tag points at - the one carrying the version bump.
      # Checking out `main` instead would race any commit merged behind it.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Require immutable candidate identity
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: '[[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]'

  # Reuse the complete, secret-free CI contract at the tag's exact commit.
  # Verifying the dispatch branch alone would race a later merge to main.
  candidate:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  # Installers, built only after candidate browser/unit/native verification.
  #
  # This is a second job in the same workflow rather than a workflow triggered
  # by the tag, and it has to be: a tag pushed by the default GITHUB_TOKEN does
  # not start another workflow run. A separate `on: push: tags` file would
  # simply never fire.
  build:
    needs: [release-please, candidate]
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than an Intel and an Apple-silicon
          # download. It is a larger file, but the website gets a single macOS
          # link and nobody has to know which Mac they own.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:config
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v1
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Signs the update artifacts so installed apps will accept them. This
          # is Tauri's own key, and is not the OS code signature below - an
          # update signed with it still shows an "unidentified developer"
          # warning on a fresh install if the bundle itself is unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Gatekeeper. The certificate signs the bundle; notarisation is what
          # actually clears it, and needs the Apple ID credentials as well -
          # a signed-but-unnotarised app is still blocked on first launch.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          # The release already exists - Release Please made it. Naming the tag
          # attaches the installers and `latest.json` to that one rather than
          # opening a second, empty release beside it.
          releaseId: ${{ needs.release-please.outputs.id }}
          tagName: ${{ needs.release-please.outputs.tag }}
          # Promotion is a separate, human-approved phase after live acceptance.
          releaseDraft: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.generated.json
