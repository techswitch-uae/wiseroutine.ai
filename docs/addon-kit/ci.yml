name: Addon kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      # The export includes a pruned, public-only lockfile; keep it reviewed and committed.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build && pnpm test && pnpm typecheck
      # No signing, deployment, publishing credentials or automatic promotion here.
